# =============================================================================
# Production compose — mirrors the VPS deployment.
# Use docker-compose.dev.yml for local development.
# =============================================================================

name: kinikh-ivr

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-common-env: &common-env
  APP_ENV: production
  APP_DEBUG: "false"
  DATABASE_URL: postgresql+asyncpg://kinikh:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/kinikh_ivr
  REDIS_URL: redis://redis:6379/0

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: kinikh
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: kinikh_ivr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinikh -d kinikh_ivr"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── FastAPI app ────────────────────────────────────────────────────────────
  app:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-app:${IMAGE_TAG:-local}
    init: true
    stop_grace_period: 130s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    restart: unless-stopped
    logging: *logging
    env_file:
      - ../.env
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - app_logs:/app/logs
      - app_storage:/app/storage
    networks:
      - internal
      - public
    expose:
      - "8000"

  # ── Alembic migrations (init container) ───────────────────────────────────
  migrate:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-app:${IMAGE_TAG:-local}
    logging: *logging
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    env_file:
      - ../.env
    environment:
      <<: *common-env
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR with fullchain.pem and privkey.pem}:/etc/nginx/certs:ro
      - ${ACME_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      app:
        condition: service_healthy
    networks:
      - public

volumes:
  app_logs:
  app_storage:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
