# =============================================================================
# Production compose — mirrors the VPS deployment.
# Use docker-compose.dev.yml for local development.
# =============================================================================

x-common-env: &common-env
  DATABASE_URL: postgresql+asyncpg://kinikh:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/kinikh_ivr
  REDIS_URL: redis://redis:6379/0

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinikh
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: kinikh_ivr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinikh -d kinikh_ivr"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── FastAPI app ────────────────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ../logs:/app/logs
    networks:
      - internal
      - public
    expose:
      - "8000"

  # ── Alembic migrations (init container) ───────────────────────────────────
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    env_file:
      - ../.env
    environment:
      <<: *common-env
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR with fullchain.pem and privkey.pem}:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - public

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
