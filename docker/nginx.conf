# =============================================================================
# Nginx — reverse proxy for Kinikh IVR
# =============================================================================
worker_processes auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept       on;
    use                epoll;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';

    # Same as main but without the query string — telephony URLs carry the
    # webhook secret (?webhook_token=) and short-lived stream tokens.
    log_format redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent '
                        'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log redacted;

    # Performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 16M;
    server_tokens      off;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript;

    limit_req_status 429;

    # Rate limiting zones
    limit_req_zone  $binary_remote_addr zone=api:10m    rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=webhook:10m rate=120r/m;
    limit_req_zone  $binary_remote_addr zone=auth:10m   rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    upstream app {
        server app:8000;
        keepalive 64;
    }

    # ── HTTP — redirect to HTTPS in production ────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check — allow direct HTTP (load-balancer probes)
        location = /api/v1/health {
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        # Everything else — redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           DENY                                  always;
        add_header X-Content-Type-Options    nosniff                               always;
        add_header X-XSS-Protection          "1; mode=block"                       always;

        # ── WebSocket / Exotel audio stream ──────────────────────────────────
        location /api/v1/telephony/stream {
            # The URL contains a short-lived bearer token; never log the query string.
            access_log off;
            limit_req  zone=webhook burst=50 nodelay;
            limit_conn perip 20;

            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ── Telephony webhooks ───────────────────────────────────────────────
        # X-Forwarded-For is overwritten with the real peer (never appended to
        # a client-supplied value) so EXOTEL_ALLOWED_CIDRS can't be spoofed.
        location /api/v1/telephony/ {
            access_log /var/log/nginx/access.log redacted;
            limit_req zone=webhook burst=30 nodelay;
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Auth endpoints (stricter rate limit) ─────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── REST API ─────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # ── Health check ─────────────────────────────────────────────────────
        location = /api/v1/health {
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        # ── React dashboard (static build from the `web` image stage) ────────
        root /usr/share/nginx/html;

        # Vite emits content-hashed file names under /assets/ — cache forever.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # The app shell must never be cached, or clients keep requesting
        # hashed assets from a previous deploy. (add_header here replaces the
        # server-level security headers, so they are repeated.)
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options           DENY                                  always;
            add_header X-Content-Type-Options    nosniff                               always;
        }

        # React client-side routes (/calls, /leads/123, ...) resolve to the
        # application shell; unknown /api/* paths never reach here because
        # the /api/ location above proxies them to FastAPI.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
