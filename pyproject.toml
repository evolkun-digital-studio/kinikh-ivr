[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "kinikh-ivr"
version = "1.0.0"
description = "AI Voice Receptionist — captures leads from inbound calls"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Kinikh", email = "info@kinikh.com" }]

dependencies = [
    "numpy>=1.26,<3",
    "fastapi==0.128.8",
    "uvicorn[standard]==0.34.3",
    "starlette==0.49.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.11.0",
    "pydantic[email]==2.13.4",
    "python-multipart==0.0.20",
    "SQLAlchemy==2.0.51",
    "greenlet==3.5.6",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.12",
    "alembic==1.16.5",
    "redis==5.2.1",
    "openai==2.44.0",
    "elevenlabs==2.54.0",
    "exotel==0.1.5",
    "httpx==0.28.1",
    "certifi==2026.6.17",
    "loguru==0.7.3",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    # Pinned <4.1 — passlib 1.7.4's bcrypt backend probes `bcrypt.__about__`,
    # removed in bcrypt>=4.1, which crashes hash_password()/verify_password().
    "bcrypt==4.0.1",
    "Jinja2==3.1.6",
    "aiofiles==25.1.0",
    "python-dotenv==1.2.1",
    "email-validator==2.3.0",
    "websockets==15.0.1",
    "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.2.1",
    "httpx==0.28.1",
    "ruff==0.11.13",
    "black==25.1.0",
    "isort==5.13.2",
    "pre-commit==4.2.0",
    "anyio[trio]==4.12.1",
]

[project.scripts]
kinikh-ivr = "app.main:app"

# ---------------------------------------------------------------------------
# Setuptools
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
exclude = [
    ".git",
    ".ruff_cache",
    "venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations
    "RUF",  # ruff-specific
]
ignore = [
    "ANN401", # Dynamically typed expressions (Any) are disallowed
    "S101",   # Use of assert detected (fine in tests)
    "S105",   # Possible hardcoded password — false positives in test fixtures
    "S106",   # Possible hardcoded password
    "B008",   # Do not perform function calls in argument defaults (FastAPI Depends)
    "N818",   # Exception names should end in Error (not always)
    "RUF012", # Mutable class attributes (false positives with SQLAlchemy)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "N802", "N803"]
"alembic/**" = ["ANN", "N999"]
# Prompt text is prose: wrapping it would change what the model reads.
"app/prompts/system.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    venv
  | alembic/versions
  | \.git
)/
'''

# ---------------------------------------------------------------------------
# isort
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
# The local `alembic/` directory (migration env) shadows the third-party
# `alembic` package name — pin it explicitly so isort doesn't mistake
# `from alembic import context` for a first-party import.
known_third_party = ["alembic"]
skip_glob = ["venv/*", "alembic/versions/*"]
force_sort_within_sections = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
addopts = "--tb=short -q"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["*/venv/*", "*/tests/*", "alembic/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
